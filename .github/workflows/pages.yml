# Publishes docs/ to GitHub Pages at https://matthupy.github.io/vismod/
#
# No manual repo setup needed: configure-pages runs with `enablement: true`,
# so it provisions the Pages site over the API on first run and sets the
# build type to "workflow". Without that flag the action fails at
# `Get Pages site failed ... Not Found` on a repo where Pages was never
# turned on in Settings.
#
# The docs are plain Markdown with a small YAML front-matter block, so the
# same files stay readable on github.com and in an editor. Jekyll config
# lives in docs/_config.yml.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # enablement: true turns Pages on for the repo if it is not already,
      # rather than erroring out and demanding a trip through Settings.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
