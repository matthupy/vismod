# CI runs with NO secrets and NO network access to providers: the suite
# uses interface fakes, httptest, miniredis, and (where present) ffmpeg.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (integration tests skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (both modes, ffmpeg bundled, non-root)
        run: docker build -t vismod:ci .
      - name: Smoke: version + workflows validate inside the image
        run: |
          docker run --rm vismod:ci version
          docker run --rm vismod:ci workflows validate
