# CI runs with NO secrets and NO network access to providers: the suite
# uses interface fakes, httptest, miniredis, and (where present) ffmpeg.
#
# Repository structure note: vismod is now a single self-contained module
# (`github.com/vismod/vismod`) with no `replace` directives, so every job
# checks out this repo alone and runs from the repo root. Earlier
# revisions checked out a sibling `videosift` repo to satisfy a
# `replace => ../videosift`; that directive is gone and the extra
# checkout with it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # vismod execs ffmpeg + ffprobe; installing them means the frame
      # extraction integration tests run instead of skipping.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...

      - run: go vet ./...

      # The race detector is the reason this job matters: the primary dev
      # machine has CGO_ENABLED=0 and no C toolchain, so `-race` cannot run
      # locally. CI is the only gate for data races.
      - name: Test (race detector + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./... -count=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false   # coverage reporting must not gate merges

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Installed from source with the project's Go toolchain so the linter
      # is built against the same Go version go.mod targets. Prebuilt
      # golangci-lint releases lag new Go versions and refuse a newer `go`
      # directive, which go.mod (1.26.x) trips.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Context is the repo root — the Dockerfile COPYs the whole module.
      # Loaded into the local daemon (not pushed) so the smoke steps below
      # can actually run the image.
      - name: Build image (both modes, ffmpeg bundled, non-root)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: vismod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — version + workflows validate inside the image
        run: |
          docker run --rm vismod:ci version
          docker run --rm vismod:ci workflows validate

      # Catches drift between compose.yaml and the files it mounts without
      # starting anything: `config` fully resolves the merge, the env_file,
      # the anchors, and every bind-mount path.
      - name: Validate compose stack resolves
        run: |
          cp deploy/compose/env.example .env
          cp deploy/compose/config.compose.example.yaml deploy/compose/config.compose.yaml
          docker compose config --quiet
