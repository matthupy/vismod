name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege: jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out vismod
        uses: actions/checkout@v7
        with:
          path: vismod

      # vismod's go.mod has `replace github.com/matthupy/videosift => ../videosift`,
      # so the sibling repo must be present for build/vet/test to resolve.
      - name: Check out videosift (replace target)
        uses: actions/checkout@v7
        with:
          repository: matthupy/videosift
          path: videosift

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vismod/go.mod
          cache-dependency-path: vismod/go.sum

      # videosift execs ffmpeg+ffprobe; install them so the M2 frame-extraction
      # integration test runs instead of skipping.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify go.mod / go.sum are tidy
        working-directory: vismod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        working-directory: vismod
        run: go build ./...

      - name: go vet
        working-directory: vismod
        run: go vet ./...

      - name: Test (race detector + coverage)
        working-directory: vismod
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out vismod
        uses: actions/checkout@v7
        with:
          path: vismod

      - name: Check out videosift (replace target)
        uses: actions/checkout@v7
        with:
          repository: matthupy/videosift
          path: videosift

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vismod/go.mod
          cache-dependency-path: vismod/go.sum

      # Install from source with the project's Go toolchain so the linter binary
      # is built with the same Go version go.mod targets (prebuilt releases lag
      # behind new Go versions and refuse a newer `go` directive).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: golangci-lint
        working-directory: vismod
        run: golangci-lint run ./...

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out vismod
        uses: actions/checkout@v7
        with:
          path: vismod

      - name: Check out videosift (replace target)
        uses: actions/checkout@v7
        with:
          repository: matthupy/videosift
          path: videosift

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: vismod/go.mod
          cache-dependency-path: vismod/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: vismod
        run: govulncheck ./...
