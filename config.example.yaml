# vismod configuration example.
#
# Secrets are NEVER read from this file. They come only from environment
# variables with the VISMOD_ prefix (dots -> underscores), e.g.:
#   VISMOD_AZURE_KEY=...        VISMOD_AZURE_ENDPOINT=https://<res>.cognitiveservices.azure.com
#   VISMOD_HIVE_TOKEN=...
#   VISMOD_GOOGLE_API_KEY=...   (or VISMOD_GOOGLE_TOKEN=... for auth_mode: bearer)
#
# Thresholds are PER-ADAPTER and NOT portable: a 0.667 threshold means a
# different thing for Azure severity/6, a Hive per-head probability, a Google
# SafeSearch likelihood bucket, and an AWS confidence/100 score. Re-tune
# thresholds whenever you switch adapters.

adapter:
  name: stub            # "stub" (no creds), "azure", "hive", or "google". Selects the single active model.
  options: {}           # adapter-specific, opaque to the core; decoded inside the adapter.

  # --- Azure AI Content Safety (image:analyze) ---
  # Set name: azure and uncomment. All options below are NON-secret. The API key
  # / bearer token are env-ONLY (never in yaml):
  #   VISMOD_AZURE_KEY=...      (auth_mode: apikey, the default)
  #   VISMOD_AZURE_TOKEN=...    (auth_mode: bearer — Entra ID token acquired out-of-band
  #                              for scope https://cognitiveservices.azure.com/.default)
  #   VISMOD_AZURE_ENDPOINT=... (alternative to options.endpoint below)
  # options:
  #   endpoint: https://<resource>.cognitiveservices.azure.com  # required (or VISMOD_AZURE_ENDPOINT)
  #   auth_mode: apikey         # apikey (default) | bearer
  #   api_version: "2024-09-01" # GA; Azure deprecates on ~90-day cadence
  #   rps: 5                    # shared token-bucket rate (Azure F0 = 5 RPS; S0 = 100/s)
  #   max_retries: 3            # transient (429/5xx/net) retries before failing the frame (0 disables)
  #   retry_backoff: 500ms      # base backoff; doubles per attempt (+jitter), capped 30s, honors Retry-After
  # NOTE: v1 sends inline base64 content ONLY. Remote blobUrl is disabled (SSRF/egress).
  # Azure thresholds are NOT portable to other adapters (severity/6 scale) — re-tune below.

  # --- Hive (thehive.ai) visual moderation (v2 /task/sync, image) ---
  # Set name: hive and uncomment. The API token is env-ONLY (never in yaml):
  #   VISMOD_HIVE_TOKEN=...   (sent as "Authorization: Token <token>")
  # options:
  #   endpoint: https://api.thehive.ai/api/v2/task/sync  # default; override for a regional host
  #   rps: 5                  # shared token-bucket rate (tune to your Hive plan)
  #   max_retries: 3          # transient (429/5xx/net) retries before failing the frame (0 disables)
  #   retry_backoff: 500ms    # base backoff; doubles per attempt (+jitter), capped 30s, honors Retry-After
  # Hive returns ~50 per-head class scores per image; the adapter reconstructs heads
  # and emits one normalized CategoryResult per canonical category (score_origin:
  # probability). Hive probabilities are NOT comparable to Azure severity/6 — a 0.667
  # threshold means a different thing per adapter. Image-only in v1 (video is native
  # to Hive but framed via videosift here, same as Azure).

  # --- Google Cloud Vision SafeSearch (images:annotate, image) ---
  # Set name: google and uncomment. Credentials are env-ONLY (never in yaml):
  #   VISMOD_GOOGLE_API_KEY=...   (auth_mode: apikey, the default — sent as ?key=)
  #   VISMOD_GOOGLE_TOKEN=...     (auth_mode: bearer — OAuth2/ADC access token acquired
  #                                out-of-band, e.g. `gcloud auth print-access-token`)
  #   VISMOD_GOOGLE_PROJECT=...   (optional, bearer only — sent as x-goog-user-project
  #                                for billing/quota attribution)
  # options:
  #   endpoint: https://vision.googleapis.com/v1/images:annotate  # default; override for a test host
  #   auth_mode: apikey       # apikey (default) | bearer
  #   rps: 5                  # shared token-bucket rate (tune to your Vision quota)
  #   max_retries: 3          # transient (429/5xx/net) retries before failing the frame (0 disables)
  #   retry_backoff: 500ms    # base backoff; doubles per attempt (+jitter), capped 30s, honors Retry-After
  # SafeSearch returns five ORDINAL likelihood enums (adult/spoof/medical/violence/racy),
  # each UNKNOWN/VERY_UNLIKELY..VERY_LIKELY. The adapter maps them to a fixed [0,1] lookup
  # (VERY_UNLIKELY=0.0 .. VERY_LIKELY=1.0; UNKNOWN -> score null = could-not-evaluate) with
  # score_origin: likelihood_enum. Mapping: adult->SEXUAL, racy->SUGGESTIVE_RACY,
  # violence->VIOLENCE, medical->MEDICAL, spoof->SPOOF. MEDICAL/SPOOF are provenance-only,
  # NOT harm signals. These likelihood buckets are NOT comparable to Azure severity/6 or
  # Hive probabilities — re-tune thresholds. v1 sends inline base64 content only (no gcsImageUri).

# Two boundaries per category: flag_at (-> verdict flag) and block_at (-> verdict block).
# Categories not listed fall back to thresholds.default.
thresholds:
  default:
    flag_at: 0.5
    block_at: 0.8
  SEXUAL:               # strictest by default
    flag_at: 0.5
    block_at: 0.667
    potential_csam: 0.667   # SEXUAL score at/above which a frame is treated as potential-CSAM (M4 divert)

queue:
  driver: memory        # "memory" (dev/CLI, non-durable) or "redis" (durable, at-least-once).
  workers: 4            # parallel job workers (bounds parallelism, not throughput)
  buffer: 64            # in-memory FIFO buffer depth (memory driver only)
  max_retries: 3        # bounded retry before dead-letter (both drivers)
  retry_backoff: 500ms  # linear backoff base between retries (both drivers)
  drain_timeout: 30s    # graceful-drain budget for in-flight jobs on shutdown
  job_timeout: 60s      # per-job processing timeout
  deadletter_max: 1024  # DLQ depth cap; at capacity new enqueues are rejected (memory driver)
  redis_addr: localhost:6379   # REQUIRED when driver=redis; PING-validated at boot AND on /readyz
  dedup_ttl: 168h       # redis driver only: lifetime of a cross-process dedup claim (§L #9).
                        # MUST exceed the max redelivery window (asynq retention + retry backoff).
  # redis driver (asynq-backed): durable + at-least-once across restarts and multiple
  # workers/replicas. At-least-once requires idempotency — a Redis-backed dedup gate
  # (key vismod:done:<job_id>, dedup_ttl) records each committed job so a redelivery to a
  # FRESH process or replica re-uses that fact and never double-writes the sink/audit
  # (the in-memory per-process guards alone could not span processes). Job payloads in Redis
  # carry only opaque IDs/refs (file paths), never media bytes. A Redis outage flips
  # /readyz to not-ready (backpressure) rather than accepting jobs it cannot hold.

frames:
  workdir: ""           # absolute, caller-owned, ephemeral, writable dir (empty -> system temp under a vismod dir)
  max_frames: 64        # REQUIRED > 0: primary bound on per-video cost AND peak disk
  concurrency: 4        # per-job moderation fan-out limit (distinct from videosift internal concurrency)
  scene: true
  keyframe: true
  temporal: true
  mpdecimate: true
  # videosift extraction tuning (defaults mirror videosift; NOT verdict-affecting)
  scene_threshold: 0.4        # scene-change score in (0, 1]; LOWER=more sensitive. 0 is NOT max-sensitive: videosift re-defaults 0 -> 0.4
  temporal_interval: 2.0      # seconds between uniform samples
  mpdecimate_hi: 768          # mpdecimate high threshold
  mpdecimate_lo: 320          # mpdecimate low threshold
  mpdecimate_frac: 0.33       # mpdecimate fraction of changed blocks
  hash_algo: "phash"          # phash|dhash
  hamming_threshold: 8        # max hash distance for dedup; 0 disables dedup
  hash_resize_width: 256      # pre-hash scale width; 0 disables (not recommended)
  videosift_concurrency: 0    # videosift internal strategy parallelism (0 -> #enabled strategies)
  ffmpeg_path: ""       # override ffmpeg binary (empty -> discovered on PATH; validated at boot)
  ffprobe_path: ""      # override ffprobe binary (empty -> discovered on PATH; validated at boot)

log:
  level: info           # debug | info | warn | error

metrics:
  addr: ":9090"         # serve exposes /healthz, /readyz and Prometheus /metrics here

audit:
  # Tamper-evident decision log (§G.5): append-only, hash-chained, idempotent per
  # job_id. Stores SHA-256(Raw) + ModelIdentity + verdict — NEVER media or Raw text.
  # Empty disables the trail (OK for one-shot CLI scans). A production `serve`
  # SHOULD set an absolute path on durable storage. Verify with:
  #   vismod audit verify <path>
  path: ""              # e.g. /var/lib/vismod/audit.log
