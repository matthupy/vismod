# vismod — local/dev stack: the durable redis (asynq) serve path (§I, §D.3, §L).
#
# Brings up the long-running moderation worker against a Redis-backed queue, plus
# an OPTIONAL asynqmon queue UI. This is the production-shaped topology (driver=redis),
# sized for a single dev box — NOT a hardened prod manifest (no TLS, no auth, single
# Redis). For prod: external HA Redis, secrets from a vault, tmpfs/emptyDir frames,
# asynqmon behind an authenticating proxy (§G.2).
#
# 🔴 BUILD CONTEXT = PARENT directory (build.context: ..). go.mod has
#   replace github.com/matthupy/videosift => ../videosift
# (§B: co-developed, tracked-latest, never pinned), so the sibling videosift checkout
# MUST sit next to this repo:
#   parent/
#     vismod/      <- this file + Dockerfile
#     videosift/   <- git clone https://github.com/matthupy/videosift
#
# Secrets are NEVER inline here — they interpolate from a .env file (see .env.example)
# or the shell environment, and reach the binary as VISMOD_-prefixed env vars only.
#
# Usage:
#   cp .env.example .env                 # fill creds only if using azure/hive
#   docker compose up --build            # stub adapter, no creds needed
#   docker compose --profile ui up       # also start asynqmon on 127.0.0.1:8080
#   curl -sf localhost:9090/readyz       # readiness (boot validation + redis PING)
#   curl -s  localhost:9090/metrics      # Prometheus exposition
#   # one-shot scan (memory driver, bypasses the queue/redis):
#   docker compose run --rm vismod scan /data/clip.mp4
#   # enqueue into the running redis worker: pipe newline-delimited paths to a serve stdin
#   echo /data/x.jpg | docker compose run --rm -T vismod serve

name: vismod

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on so the durable-queue promise survives a redis restart (matches the
    # at-least-once contract the redis driver depends on).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Not published to the host: only the compose network reaches it. Avoids
    # exposing an unauthenticated Redis on the dev box.

  vismod:
    build:
      context: ..                  # PARENT dir — videosift sibling must resolve (replace)
      dockerfile: vismod/Dockerfile
    image: vismod:dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy  # serve PINGs redis at boot; wait until it answers
    environment:
      # --- queue: durable redis (asynq) path (§D.3/§L) ---
      VISMOD_QUEUE_DRIVER: redis
      VISMOD_QUEUE_REDIS_ADDR: redis:6379
      VISMOD_QUEUE_WORKERS: "4"
      VISMOD_QUEUE_DEDUP_TTL: 168h     # must outlive the redelivery window (§L #9)
      # --- adapter: stub by default (no creds). Set azure/hive + the matching
      #     secret env below to switch the single active model. ---
      VISMOD_ADAPTER_NAME: stub
      # --- observability + storage ---
      VISMOD_METRICS_ADDR: ":9090"
      VISMOD_LOG_LEVEL: info
      VISMOD_FRAMES_WORKDIR: /var/lib/vismod/frames
      VISMOD_AUDIT_PATH: /var/lib/vismod/audit.log
      # --- secrets: interpolated from .env / shell ONLY, never written inline.
      #     Unset -> empty (fine for the stub adapter). ---
      VISMOD_AZURE_KEY: ${VISMOD_AZURE_KEY:-}
      VISMOD_AZURE_ENDPOINT: ${VISMOD_AZURE_ENDPOINT:-}
      VISMOD_HIVE_TOKEN: ${VISMOD_HIVE_TOKEN:-}
    ports:
      # Bind localhost only: /healthz /readyz /metrics are ops endpoints, not public.
      - "127.0.0.1:9090:9090"
    volumes:
      # Persists the audit chain. Frames live under here too but are cleaned per-job
      # (§D.4); prod should overlay an ephemeral tmpfs/emptyDir at .../frames.
      - vismod-state:/var/lib/vismod
      # Mount host media read-only for scan/enqueue. Drop or repoint as needed.
      - ./data:/data:ro
    # Image already sets a /healthz HEALTHCHECK and STOPSIGNAL SIGTERM (graceful drain).

  # Optional asynq operator UI. Enable with: docker compose --profile ui up
  # §G.2: payloads carry only opaque IDs/refs (no media), but asynqmon is itself
  # UNAUTHENTICATED — bound to localhost here; put it behind an auth proxy in prod.
  asynqmon:
    image: hibiken/asynqmon:latest
    profiles: ["ui"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["--redis-addr=redis:6379"]
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  redis-data:
  vismod-state:
